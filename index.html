<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC 2026 Core Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> UPSC 2026 Deck</div>
        <div class="live-controls">
            <button id="sync-live-btn" class="sync-btn"><i class="fa-solid fa-cloud-arrow-down"></i> Sync Feed</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <h3>Syllabus Pillars</h3>
            <ul class="pillar-list">
                <li class="active" data-pillar="all">Show All</li>
                <li data-pillar="polity">Polity</li>
                <li data-pillar="economy">Economy</li>
                <li data-pillar="environment">Environment</li>
            </ul>
        </aside>
        <main class="feed-window">
            <div class="articles-grid"></div>
        </main>
    </div>

    <div id="article-reader-overlay">
        <div id="reader-modal-body">
            <button id="close-modal-btn">Close [X]</button>
            <div id="content-area"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
