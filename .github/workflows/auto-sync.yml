name: Daily UPSC Dashboard Auto-Sync

on:
  schedule:
    # Runs at 00:30 UTC (6:00 AM IST) every single day
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger button

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Scraper Engine
      run: python scraper.py

    - name: Commit and Push Updates Securely
      run: |
        git config --global user.name "GitHub Automation Bot"
        git config --global user.email "actions@github.com"
        git add app.js
        git diff-index --quiet HEAD || git commit -m "Automated Daily Feed Update [Skip CI]"
        git push
